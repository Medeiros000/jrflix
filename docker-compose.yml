version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jrflix_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jrflix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jrflix_password}
      POSTGRES_DB: ${POSTGRES_DB:-jrflix_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jrflix-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jrflix_backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-jrflix}:${POSTGRES_PASSWORD:-jrflix_password}@postgres:5432/${POSTGRES_DB:-jrflix_db}?schema=public
      MEDIA_ROOT_PATH: /app/media
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - ./midias:/app/media
    depends_on:
      - postgres
    networks:
      - jrflix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jrflix_frontend
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jrflix-network

volumes:
  postgres_data:

networks:
  jrflix-network:
    driver: bridge

